PLG_SYSTEM_AKWARN="Système - Avertissement sur les fichiers résiduels de restauration Akeeba Backup"
PLG_SYSTEM_AKWARN_XML_DESCRIPTION="Ce plugin vérifie la présence de fichiers résiduels issus d'une restauration d'archive Akeeba Backup à la racine de votre site à chaque visite de la page du tableau de bord de Joomla. Il vous avertit de leur existence et vous propose de les supprimer."
