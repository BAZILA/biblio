PLG_QUICKICON_AKEEBABACKUP="Icône rapide - Notification Akeeba Backup"
PLG_QUICKICON_AKEEBABACKUP_XML_DESCRIPTION="Affiche une icône Akeeba Backup dans votre interface d'administration, vous avertissant lorsqu'une sauvegarde est en retard (configurable)."

PLG_QUICKICON_AKEEBABACKUP_GROUP_DESC="Le groupe de ce plugin (cette valeur est comparée à la valeur de groupe utilisée dans les modules <strong>Icônes rapides</strong> pour y injecter des icônes)"
PLG_QUICKICON_AKEEBABACKUP_GROUP_LABEL="Groupe"

PLG_QUICKICON_AKEEBABACKUP_LBL_WARNINGS="Activer l'icône d'avertissement"
PLG_QUICKICON_AKEEBABACKUP_DESC_WARNINGS="Lorsque cette option est activée, l'icône du logo Akeeba Backup affiche un petit signe d'avertissement si la sauvegarde a échoué ou est obsolète (voir ci-dessous)."
PLG_QUICKICON_AKEEBABACKUP_LBL_WARNFAILED="Avertir en cas d'échec de sauvegarde"
PLG_QUICKICON_AKEEBABACKUP_DESC_WARNFAILED="Lorsque cette option et la précédente sont toutes deux activées, une icône d'avertissement s'affiche si la dernière sauvegarde a échoué."
PLG_QUICKICON_AKEEBABACKUP_LBL_PERIOD="Délai de désuétude de la sauvegarde, en heures"
PLG_QUICKICON_AKEEBABACKUP_DESC_PERIOD="Considère qu'une sauvegarde est obsolète si ce nombre d'heures s'est écoulé depuis la dernière sauvegarde réussie. Si la sauvegarde est obsolète, une icône d'avertissement s'affiche si la première option est activée."

PLG_QUICKICON_AKEEBABACKUP_PROFILE_LABEL="Profil de sauvegarde"
PLG_QUICKICON_AKEEBABACKUP_PROFILE_DESC="Choisissez le profil de sauvegarde qui sera utilisé pour effectuer une sauvegarde complète du site lorsque l'icône de sauvegarde est cliquée."
