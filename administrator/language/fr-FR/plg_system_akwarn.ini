PLG_SYSTEM_AKWARN_CARD_HEAD="Fichiers résiduels de restauration détectés"

PLG_SYSTEM_AKWARN_INFO="Akeeba Backup a détecté des fichiers et/ou des répertoires qui semblent être des reliquats d'une restauration de site. Laisser ces fichiers et/ou répertoires à la racine de votre site peut constituer un problème de sécurité pour diverses raisons."
PLG_SYSTEM_AKWARN_RECOMMEND_DELETE="Nous vous recommandons vivement de supprimer les fichiers résiduels suivants de la racine de votre site <em>dès que possible</em>. Vous pouvez également déplacer manuellement ces fichiers et/ou répertoires vers un répertoire situé au-dessus (en dehors) de la racine web de votre site."
PLG_SYSTEM_AKWARN_DETECTED_FILES="Fichiers et/ou répertoires résiduels détectés"
PLG_SYSTEM_AKWARN_DELETE_FILES="Supprimer les fichiers et/ou répertoires résiduels"

