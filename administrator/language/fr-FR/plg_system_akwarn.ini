PLG_SYSTEM_AKWARN_ERR_DELETING_N_FILES_1="Impossible de supprimer un fichier/répertoire résiduel. Veuillez le supprimer manuellement via FTP/SFTP ou le gestionnaire de fichiers de votre panneau d'hébergement."
