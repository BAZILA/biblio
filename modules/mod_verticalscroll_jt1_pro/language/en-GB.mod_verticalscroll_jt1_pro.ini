MOD_VERTICALSCROLL_DESCRIPTION="<div style='padding: 10px 35px 10px 10px; font-family: Arial; font-size:13px !important; font-weight: normal !important; text-align: left; color: #4d4d4d; line-height: 24px;'><h1>Vertical Scroller JT1 Pro Module Ver. 1.6</h1><p class='img-logo'><img class='img-logo' style='float:left; width:180px;margin-right:35px;' src='../modules/mod_verticalscroll_jt1/images/logo.png' width='175' height='151' align='left' />Vertical Scroller Pro JT1 module is Pro Version of free VerticalScroll JT1 module. This module displays and continuously scrolls through the items selected. You can choose<strong> Joomla Category</strong> or <strong>K2 Content</strong> as content source or enter your own items/links manually. It uses Jquery to scroll. It features parameter options for size, scrolling speed, pausing on mouse-over and more.</p><p></p> <p class='homepage'><a href='http://www.joomlatema.net' target='_blank'>http://www.joomlatema.net</a></p><p class='license'>Thanks for choosing us. <a target='_blank' href='http://www.joomlatema.net/forum'>Support Forum.</a></p></span></div>"
MOD_VERTICALSCROLL_UPDATE="<div style='font-size: 11px; text-align: center;margin: 10px -10px 0; padding: 6px 0'> Check for Updates. <a href='http://www.joomlatema.net/english' target='_blank' style='color: #146295'>JOOMLATEMA.NET</a></div>"
MOD_VERTICALSCROLL_ABOUT="<div style='color: #555; line-height: 18px; font-size: 12px; padding: 20px 0 0'><p><strong>Developer:</strong></p><strong>Vertical Scroller JT1 Pro </strong> is the commercial (Pro) version of Free VerticalScroll JT1 Module developed by <a href='http://www.joomlatema.net/english' target='_blank' style='color: #146295'>Joomlatema.Net</a> Turkey's first free and paid Template and Extension Site. You can see all templates and extensions developed by Joomlatema.Net at <a href='http://www.joomlatema.net/english' target='_blank' style='color: #146295'>here</a> .<p style='font-size: 11px; text-align: center;margin: 60px -10px 0; border-top: 1px solid #eee; padding: 6px 0'>Thanks for choosing us. <a href='http://www.joomlatema.net/english' target='_blank' style='color: #146295'>JOOMLATEMA.NET</a></p>"
